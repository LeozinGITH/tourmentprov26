<header><div class="wrap"><a class="brand" href="#inicio"><i></i>Arena Ápice</a><nav id="nav" aria-label="Categorias"></nav></div></header>
<main class="wrap"></main>
<footer><div class="wrap small mut"><p id="status"></p><p>Dados conferidos até 25/11/2026. O acervo de conquistas é parcial. Site independente, sem vínculo com publishers, ligas ou equipes citadas.</p><p>Fontes: <span id="sources"></span></p></div></footer>

<script>
/* ===== Motor de torneios: tudo é derivado de equipes + placares ===== */
const BYE={bye:1};
const pow2=n=>{let p=1;while(p<n)p*=2;return p};
function seedOrder(size){let a=[1];while(a.length<size){const m=a.length*2+1;a=a.flatMap(s=>[s,m-s]);}return a}
function Ctx(T){
  const M={};
  function val(s){
    if(s.bye)return null;
    if('t'in s)return s.t;
    if(s.p!==undefined)return undefined;
    const m=M[s.w||s.l];return s.w?m.win:m.lose;
  }
  function match(id,a,b,bo){
    const m={id,a,b,bo};m.A=val(a);m.B=val(b);
    if(m.A!==undefined&&m.B!==undefined){
      if(m.A===null||m.B===null){m.auto=true;m.win=m.A===null?m.B:m.A;m.lose=null;}
      else{const r=T.results[id];
        if(r&&r.a===m.A&&r.b===m.B&&r.s[0]!==r.s[1]){m.score=r.s;const aw=r.s[0]>r.s[1];m.win=aw?m.A:m.B;m.lose=aw?m.B:m.A;}}
    }
    M[id]=m;return m;
  }
  return {M,val,match};
}
const W=m=>({w:m.id}),L=m=>({l:m.id});
function roundName(n){return n===1?'Final':n===2?'Semifinais':n===4?'Quartas':n===8?'Oitavas':'Rodada de '+n*2}

/* mata-mata: tipo 'single' | 'double' | 'triple' */
function elim(C,T,pre,entr,type){
  const size=pow2(Math.max(2,entr.length)),bo=T.bo,fbo=T.finalBo;
  let cur=seedOrder(size).map(s=>entr[s-1]||BYE);
  const up=[],upLosers=[];let r=0;
  while(cur.length>1){
    const ms=[];for(let i=0;i<cur.length;i+=2)ms.push(C.match(`${pre}U${r}-${i/2}`,cur[i],cur[i+1],(type==='single'&&cur.length===2)?fbo:bo));
    up.push({name:roundName(ms.length),matches:ms});upLosers.push(ms.map(L));cur=ms.map(W);r++;
  }
  const upW=cur[0];
  const sections=[{title:type==='single'?'Chave':'Chave superior',rounds:up}];
  if(type==='single')return {sections,champion:C.val(upW)};
  /* chave alimentada pelos perdedores que chegam em ondas */
  function fed(tag,waves,lastBo){
    const rounds=[],losers=[];let pool=null,k=0;
    function play(pairs){
      const ms=pairs.map((p,i)=>C.match(`${pre}${tag}${k}-${i}`,p[0],p[1],bo));k++;
      rounds.push({name:'Rodada '+k,matches:ms});losers.push(ms.map(L));return ms.map(W);
    }
    const halve=a=>{const p=[];for(let i=0;i<a.length;i+=2)p.push([a[i],a[i+1]||BYE]);return play(p)};
    for(let wave of waves){
      if(!pool){pool=wave.slice();continue}
      while(pool.length>wave.length)pool=halve(pool);
      while(wave.length>pool.length)wave=halve(wave);
      const rev=wave.slice().reverse();pool=play(pool.map((s,i)=>[s,rev[i]]));
    }
    while(pool.length>1)pool=halve(pool);
    if(rounds.length&&lastBo){const last=rounds[rounds.length-1];last.name='Final da chave';
      last.matches.forEach(m=>m.bo=lastBo)}
    return {rounds,losers,winner:pool[0]};
  }
  const mid=fed('M',upLosers,type==='double'?fbo:0);
  if(type==='double'){
    sections.push({title:'Chave inferior',rounds:mid.rounds});
    const gf=C.match(pre+'GF',upW,mid.winner,fbo);
    const fr=[{name:'Grande final',matches:[gf]}];let champion=gf.win;
    if(T.reset&&gf.score&&gf.win===gf.B){const g2=C.match(pre+'GF2',L(gf),W(gf),fbo);fr.push({name:'Jogo decisivo (reset)',matches:[g2]});champion=g2.win;}
    sections.push({title:'Decisão',rounds:fr});
    return {sections,champion};
  }
  const low=fed('B',mid.losers,0);
  sections[0].title='Chave superior · vencedor leva a vaga 1';
  sections.push({title:'Chave do meio · vaga 2',rounds:mid.rounds},{title:'Chave inferior · vaga 3',rounds:low.rounds});
  const q=[upW,mid.winner,low.winner].map(C.val);
  return {sections,champion:undefined,qualified:q,done:q.every(x=>x!==undefined)};
}

function roundRobin(ids){
  const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,out=[];
  for(let r=0;r<n-1;r++){const ps=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x!==null&&y!==null)ps.push(r%2?[y,x]:[x,y]);}out.push(ps);a.splice(1,0,a.pop());}
  return out;
}
function standings(ids,matches){
  const s=new Map(ids.map((id,i)=>[id,{id,seed:i,v:0,d:0,sf:0,sa:0}]));
  for(const m of matches){if(!m.score)continue;const a=s.get(m.A),b=s.get(m.B);a.sf+=m.score[0];a.sa+=m.score[1];b.sf+=m.score[1];b.sa+=m.score[0];s.get(m.win).v++;s.get(m.lose).d++;}
  return [...s.values()].sort((x,y)=>y.v-x.v||x.d-y.d||(y.sf-y.sa)-(x.sf-x.sa)||y.sf-x.sf||x.seed-y.seed);
}
function league(C,T,pre,name,ids){
  const rounds=roundRobin(ids).map((ps,r)=>({name:'Rodada '+(r+1),matches:ps.map((p,i)=>C.match(`${pre}R${r}-${i}`,{t:p[0]},{t:p[1]},T.bo))}));
  const all=rounds.flatMap(r=>r.matches);
  return {name,rounds,rows:standings(ids,all),done:all.length>0&&all.every(m=>m.score)};
}

/* sistema suíço: gera a próxima rodada quando a anterior termina */
function swiss(C,T,pre,ids,need){
  const st=new Map(ids.map((id,i)=>[id,{id,seed:i,v:0,d:0,sf:0,sa:0,opp:new Set()}])),rounds=[];
  for(let r=0;r<2*need-1;r++){
    const act=[...st.values()].filter(x=>x.v<need&&x.d<need).sort((a,b)=>b.v-a.v||a.d-b.d||a.seed-b.seed);
    if(!act.length)break;
    let byeTeam=null;if(act.length%2)byeTeam=act.pop();
    let pairs;
    if(r===0){const h=act.length/2;pairs=act.slice(0,h).map((x,i)=>[x,act[i+h]]);}
    else{
      let steps=0;
      const solve=(list,strict,same)=>{
        if(!list.length)return [];if(++steps>20000)return null;
        const [x,...rest]=list;
        const c=rest.slice().sort((a,b)=>(Math.abs(a.v-x.v)+Math.abs(a.d-x.d))-(Math.abs(b.v-x.v)+Math.abs(b.d-x.d))||b.seed-a.seed);
        for(const y of c){if(strict&&x.opp.has(y.id))continue;if(same&&(y.v!==x.v||y.d!==x.d))continue;const s=solve(rest.filter(z=>z!==y),strict,same);if(s)return [[x,y],...s];}
        return null;
      };
      for(const [strict,same] of [[true,true],[false,true],[true,false],[false,false]]){steps=0;pairs=solve(act,strict,same);if(pairs)break;}
    }
    const ms=pairs.map((p,i)=>{const m=C.match(`${pre}S${r}-${i}`,{t:p[0].id},{t:p[1].id},T.bo);m.tag=p[0].v+'-'+p[0].d;return m});
    rounds.push({name:'Rodada '+(r+1),matches:ms,bye:byeTeam&&byeTeam.id});
    if(!ms.every(m=>m.score))break;
    for(const m of ms){const a=st.get(m.A),b=st.get(m.B);a.opp.add(b.id);b.opp.add(a.id);a.sf+=m.score[0];a.sa+=m.score[1];b.sf+=m.score[1];b.sa+=m.score[0];st.get(m.win).v++;st.get(m.lose).d++;}
    if(byeTeam)byeTeam.v++;
  }
  const rows=[...st.values()].sort((a,b)=>b.v-a.v||a.d-b.d||(b.sf-b.sa)-(a.sf-a.sa)||a.seed-b.seed);
  const done=rows.every(x=>x.v>=need||x.d>=need);
  return {rounds,rows,done,need};
}

function gsl(C,T,pre,name,ids){
  const t=i=>({t:ids[i]});
  const m1=C.match(pre+'a',t(0),t(3),T.bo),m2=C.match(pre+'b',t(1),t(2),T.bo);
  const w=C.match(pre+'w',W(m1),W(m2),T.bo),e=C.match(pre+'e',L(m1),L(m2),T.bo);
  const d=C.match(pre+'d',L(w),W(e),T.bo);
  return {name,first:w.win,second:d.win,done:w.win!==undefined&&d.win!==undefined,
    rounds:[{name:'Abertura',matches:[m1,m2]},{name:'Vencedores',matches:[w]},{name:'Eliminação',matches:[e]},{name:'Decisiva',matches:[d]}]};
}
const LETTERS='ABCDEFGH';
function snake(ids,g){const gs=Array.from({length:g},()=>[]);ids.forEach((id,i)=>{const row=Math.floor(i/g),c=i%g;gs[row%2?g-1-c:c].push(id)});return gs}

/* regras mínimas por formato */
function validate(T){
  const n=T.teams.length,f=T.format;
  if(f==='br'||f==='rush')return n<2?'Adicione pelo menos 2 equipes.':n>18?'Uma sala comporta no máximo 18 equipes neste simulador.':'';
  const min={single:2,double:4,triple:4,league:3,swiss:4,gsl:4,groups:4,swissPlayoffs:4}[f];
  if(n<min)return `Adicione pelo menos ${min} equipes (agora: ${n}).`;
  if(n>64)return 'O limite é de 64 equipes.';
  if(f==='league'&&n>24)return 'Pontos corridos aceita até 24 equipes.';
  if(f==='gsl'&&(n%4||n>32))return `Grupos GSL precisam de múltiplos de 4 equipes (4, 8, 12, 16…). Agora: ${n}.`;
  if(f==='groups'){const g=T.groups||2;if(n<g*2)return `Com ${g} grupos, adicione pelo menos ${g*2} equipes.`;if((T.advance||2)>Math.floor(n/g))return 'Classificam mais equipes do que cabe em um grupo.';if(g*(T.advance||2)<2)return 'Classifique pelo menos 2 equipes.';}
  if(f==='swissPlayoffs'&&n-(T.direct||0)<4)return 'A fase suíça precisa de pelo menos 4 equipes além das diretas.';
  return '';
}
function build(T){
  const C=Ctx(T),ids=T.teams,f=T.format,src=ids.map(t=>({t}));
  const out={C,stages:[],champion:undefined,qualified:null};
  if(f==='single'||f==='double'||f==='triple'){
    const e=elim(C,T,'',src,f);out.stages.push({kind:'bracket',title:'',sections:e.sections});out.champion=e.champion;out.qualified=e.qualified||null;
  }else if(f==='league'){
    const g=league(C,T,'L','Classificação',ids);out.stages.push({kind:'tables',title:'Pontos corridos',groups:[g]});if(g.done)out.champion=g.rows[0].id;
  }else if(f==='swiss'||f==='swissPlayoffs'){
    const direct=f==='swissPlayoffs'?(T.direct||0):0,pool=ids.slice(direct);
    const s=swiss(C,T,'',pool,T.wins||3);out.stages.push({kind:'swiss',title:'Fase suíça',...s,direct:ids.slice(0,direct)});
    const passed=s.rows.filter(r=>r.v>=s.need);
    if(f==='swiss'){if(s.done)out.qualified=passed.map(r=>r.id);}
    else{
      let count=T.slots||Math.ceil(pool.length/2);
      const q=ids.slice(0,direct).map(t=>({t}));
      if(s.done)passed.forEach(r=>q.push({t:r.id}));else for(let i=0;i<count;i++)q.push({p:`${i+1}º da suíça`});
      const e=elim(C,T,'P',q,T.playoff||'single');out.stages.push({kind:'bracket',title:'Playoffs',sections:e.sections});out.champion=e.champion;
    }
  }else if(f==='gsl'||f==='groups'){
    const g=f==='gsl'?ids.length/4:(T.groups||2),adv=f==='gsl'?2:(T.advance||2);
    const gs=snake(ids,g).map((list,i)=>f==='gsl'?gsl(C,T,'G'+i,'Grupo '+LETTERS[i],list):league(C,T,'G'+i,'Grupo '+LETTERS[i],list));
    out.stages.push({kind:f==='gsl'?'gsl':'tables',title:'Fase de grupos',groups:gs,advance:adv});
    const done=gs.every(x=>x.done),q=[];
    for(let p=0;p<adv;p++)gs.forEach((gr,i)=>{
      const id=done?(f==='gsl'?[gr.first,gr.second][p]:gr.rows[p].id):null;
      q.push(done?{t:id}:{p:`${p+1}º do ${gr.name}`});
    });
    /* com 4 grupos e 2 vagas, cruza para evitar reencontro imediato */
    const seeds=(g===4&&adv===2)?[0,1,2,3,6,7,4,5].map(i=>q[i]):q;
    if(seeds.length>=2){const e=elim(C,T,'P',seeds,T.playoff||'double');out.stages.push({kind:'bracket',title:'Playoffs',sections:e.sections});out.champion=e.champion;}
  }
  return out;
}

/* battle royale */
const PLACE=[12,9,8,7,6,5,4,3,2,1];
function brTable(T){
  const rows=new Map(T.teams.map((id,i)=>[id,{id,seed:i,pts:0,boo:0,kills:0,n:0}]));
  let champion;const limit=T.rushPoints||80;
  (T.drops||[]).forEach(drop=>{
    if(T.format==='rush'&&champion===undefined){
      const w=Object.keys(drop).find(id=>drop[id][0]===1);
      if(w&&rows.has(w)&&rows.get(w).pts>=limit)champion=w;
    }
    for(const [id,[pos,k]] of Object.entries(drop)){const r=rows.get(id);if(!r)continue;r.pts+=(PLACE[pos-1]||0)+k;r.kills+=k;if(pos===1)r.boo++;r.n++;}
  });
  const list=[...rows.values()].sort((a,b)=>b.pts-a.pts||b.boo-a.boo||b.kills-a.kills||a.seed-b.seed);
  if(champion!==undefined){const i=list.findIndex(r=>r.id===champion);list.unshift(...list.splice(i,1));}
  if(T.format==='br'&&(T.drops||[]).length>=(T.totalDrops||6))champion=list[0]?.id;
  return {rows:list,champion,limit};
}

const LKEY='arena-apice-v1';
let local={tournaments:{},teams:{}},shared={tournaments:{},teams:{}},db=null,canWrite=false,dbState='local';
try{const s=JSON.parse(localStorage.getItem(LKEY));if(s&&s.tournaments&&s.teams)local=s}catch(e){}
const saveLocal=()=>{try{localStorage.setItem(LKEY,JSON.stringify(local))}catch(e){}};
const all=col=>{const o={...shared[col]};for(const[k,v]of Object.entries(local[col])){if(v===null)delete o[k];else o[k]=v}return o};
const clone=o=>JSON.parse(JSON.stringify(o));
const queue={},dirty={};
function put(col,id,doc){
  if(db&&canWrite){
    dirty[col+'/'+id]=doc;
    if(doc)shared[col][id]=doc;else delete shared[col][id];
    flush(col,id);
  }else{local[col][id]=doc;if(!doc&&!shared[col][id])delete local[col][id];saveLocal();}
}
async function flush(col,id){
  const k=col+'/'+id;if(queue[k])return;queue[k]=1;
  while(k in dirty){
    const d=dirty[k];delete dirty[k];
    try{const ref=db.doc(k);if(d)await ref.set(clone(d));else await ref.delete();}
    catch(e){
      if(e.code==='invalid_argument')canWrite=false;
      local[col][id]=d;saveLocal();toast('Não deu para salvar online. A alteração ficou só neste navegador.');
    }
  }
  delete queue[k];
}
async function connect(){
  try{
    if(!window.claude?.use)return;
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d)return;db=d;canWrite=(await u?.can('data.write'))!==false;dbState=canWrite?'online':'leitura';
    for(const col of ['tournaments','teams'])d.collection(col).onSnapshot(s=>{
      const o={};s.docs.forEach(x=>o[x.id]=clone(x.data()));
      for(const k of new Set([...Object.keys(dirty),...Object.keys(queue)])){const[c,id]=k.split('/');if(c===col){if(shared[col][id])o[id]=shared[col][id];else delete o[id]}}
      shared[col]=o;if(!$('dialog').open&&!typing())render();
    },()=>{dbState='local';db=null;status()});
    status();
  }catch(e){}
}

}

  return `<h2>1. Formato</h2><div class="row end">${o}</div><p class="small mut">${FORMATS[f][1]}</p>
  <h2>2. Equipes (${T.teams.length})</h2>
  ${e?.load?`<div class="row"><button data-act="load" data-id="${id}">Carregar ${e.load.length} participantes do ${e.name}</button><span class="small mut">${e.loadNote||''}</span></div>`:''}
  <div class="cols" style="margin-top:10px"><div><p class="small mut">Clique para adicionar</p><div class="row" style="margin-bottom:6px"><button data-act="newteam" data-g="${g}">Cadastrar equipe nova</button></div><div class="picker">${free.map(t=>`<button data-act="add" data-id="${id}" data-team="${esc(t.id)}">${crest(t.id,'s',false)}${esc(t.name)}</button>`).join('')}</div></div>
  <div><p class="small mut">Ordem das seeds (a 1ª é a mais forte)</p><div class="row" style="margin-bottom:6px"><button data-act="shuffle" data-id="${id}" ${T.teams.length<2?'disabled':''}>Sortear ordem</button><button data-act="clear" data-id="${id}" ${!T.teams.length?'disabled':''}>Remover todas</button></div>
  ${T.teams.length?`<ol class="seeds">${T.teams.map((t,i)=>`<li><b class="mut">${i+1}</b>${crest(t,'s')}<span class="n">${esc(team(t).name)}</span><button data-act="up" data-id="${id}" data-i="${i}" aria-label="Subir" ${!i?'disabled':''}>↑</button><button data-act="rm" data-id="${id}" data-i="${i}" aria-label="Remover">×</button></li>`).join('')}</ol>`:'<p class="mut">Nenhuma equipe ainda.</p>'}</div></div>
  <h2>3. Começar</h2>${err?`<p class="mut">${err}</p>`:''}<button class="pri" data-act="start" data-id="${id}" ${err?'disabled':''}>Gerar torneio</button>`;
}
function nm(C,src,v){if(v===null)return'<i>folga</i>';if(v!==undefined)return esc(team(v).name);if(src.p)return esc(src.p);return 'A definir'}
function matchHTML(id,C,m){
  const side=(s,v,i)=>`<span class="side ${m.score?(m.win===v?'w':'o'):v==null?'o':''}">${v?crest(v,'s',false):''}<span class="n">${nm(C,s,v)}</span><b>${m.score?m.score[i]:''}</b></span>`;
  const ready=!m.auto&&m.A!=null&&m.B!=null;
  return `<button class="match" data-act="match" data-id="${id}" data-m="${m.id}" ${ready?'':'disabled'}>${side(m.a,m.A,0)}${side(m.b,m.B,1)}<span class="meta">MD${m.bo}${m.tag?' · '+m.tag:''}${ready&&!m.score?' · lançar placar':''}</span></button>`;
}
const roundsHTML=(id,C,rounds)=>`<div class="scroll"><div class="bracket">${rounds.map(r=>{const vis=r.matches.filter(m=>!(m.auto));if(!vis.length&&!r.bye)return'';return `<div class="round"><h4>${r.name}</h4><div class="ms">${vis.map(m=>matchHTML(id,C,m)).join('')}${r.bye?`<span class="small mut">Folga: ${esc(team(r.bye).name)}</span>`:''}</div></div>`}).join('')}</div></div>`;
const tname=t=>`<span class="champline">${crest(t,'s')}<span>${esc(team(t).name)}</span></span>`;
function tableHTML(rows,q){return `<div class="scroll"><table><tr><th>#</th><th>Equipe</th><th>V</th><th>D</th><th>Mapas</th><th>Saldo</th></tr>${rows.map((r,i)=>`<tr class="${q(r,i)?'q':''}"><td>${i+1}</td><td>${tname(r.id)}</td><td>${r.v}</td><td>${r.d}</td><td>${r.sf}–${r.sa}</td><td>${r.sf-r.sa>0?'+':''}${r.sf-r.sa}</td></tr>`).join('')}</table></div>`}
function stagesHTML(id,o){
  return o.stages.map(s=>{
    let h=s.title?`<h2>${s.title}</h2>`:'';
    if(s.kind==='bracket')h+=s.sections.map(x=>x.rounds.length?`<h3 style="margin:18px 0 10px">${x.title}</h3>${roundsHTML(id,o.C,x.rounds)}`:'').join('');
    if(s.kind==='tables')h+=s.groups.map(gr=>`<h3 style="margin-top:18px">${gr.name}</h3>${tableHTML(gr.rows,(r,i)=>s.advance&&i<s.advance)}<details ${s.groups.length===1?'open':''}><summary>Jogos do ${s.advance?gr.name:'campeonato'}</summary><div style="margin-top:10px">${roundsHTML(id,o.C,gr.rounds)}</div></details>`).join('');
    if(s.kind==='gsl')h+=s.groups.map(gr=>`<h3 style="margin:18px 0 10px">${gr.name}${gr.done?` · passam ${esc(team(gr.first).name)} e ${esc(team(gr.second).name)}`:''}</h3>${roundsHTML(id,o.C,gr.rounds)}`).join('');
    if(s.kind==='swiss')h+=(s.direct.length?`<p class="small mut">Direto nos playoffs: ${s.direct.map(t=>esc(team(t).name)).join(', ')}</p>`:'')+roundsHTML(id,o.C,s.rounds)+tableHTML(s.rows,r=>r.v>=s.need);
    return h;
  }).join('');
}
function brHTML(id,T){
  const r=brTable(T),full=T.format==='br'&&T.drops.length>=T.totalDrops,over=full||r.champion!==undefined&&T.format==='rush';
  return {champion:r.champion,over,html:`<div class="row" style="margin-top:16px"><button class="pri" data-act="drop" data-id="${id}" ${over?'disabled':''}>Lançar queda ${T.drops.length+1}</button><button data-act="simdrop" data-id="${id}" ${over?'disabled':''}>Simular queda</button><button data-act="undodrop" data-id="${id}" ${!T.drops.length?'disabled':''}>Desfazer última queda</button><span class="mut">${T.format==='br'?`${T.drops.length} de ${T.totalDrops} quedas`:`${T.drops.length} quedas · meta ${r.limit} pontos`}</span></div>
  <div class="scroll"><table><tr><th>#</th><th>Equipe</th><th>Pontos</th><th>Booyahs</th><th>Abates</th>${T.format==='rush'?'<th>Situação</th>':''}</tr>${r.rows.map((x,i)=>`<tr class="${!i&&r.champion===x.id?'q':''}"><td>${i+1}</td><td>${tname(x.id)}</td><td><b>${x.pts}</b></td><td>${x.boo}</td><td>${x.kills}</td>${T.format==='rush'?`<td>${r.champion===x.id?'Campeã':x.pts>=r.limit&&r.champion===undefined?'Precisa de um Booyah':''}</td>`:''}</tr>`).join('')}</table></div>`};
}
function tourPage(id){
  const T=all('tournaments')[id],br=T.format==='br'||T.format==='rush';
  let h=`<p><a href="#${T.game}" style="color:var(--mut)">← ${GAMES[T.game].name}</a></p><div class="gband"><label style="max-width:560px">Nome do torneio<input id="tname" data-id="${id}" value="${esc(T.name)}" maxlength="70" style="font:700 20px var(--disp)"></label><p class="small mut">Torneio montado neste site. Os placares daqui não são resultados oficiais.</p></div>`;
  if(!T.started||validate(T))return h+setupView(id,T)+`<h2>Excluir</h2><button data-act="del" data-id="${id}">Excluir torneio</button>`;
  let body,champion,qualified,open=0;
  if(br){const b=brHTML(id,T);body=b.html;champion=b.champion}
  else{const o=build(T);body=stagesHTML(id,o);champion=o.champion;qualified=o.done===false?null:o.qualified;if(qualified&&qualified.some(x=>x===undefined))qualified=null;open=Object.values(o.C.M).filter(m=>!m.auto&&!m.score&&m.A!=null&&m.B!=null).length}
  h+=`<div class="row" style="margin-top:14px"><span class="tag">${FORMATS[T.format][0]}</span><span class="tag">${T.teams.length} equipes</span><span class="sp"></span>${!br?`<button data-act="simone" data-id="${id}" ${!open?'disabled':''}>Simular próximo jogo</button><button data-act="simall" data-id="${id}" ${!open?'disabled':''}>Simular até o fim</button>`:''}<button data-act="edit" data-id="${id}">Editar equipes e formato</button><button data-act="del" data-id="${id}">Excluir torneio</button></div>`;
  if(champion)h+=`<div class="winner">${crest(champion,'l')}<div><div class="mut">Campeã deste torneio</div><strong>${esc(team(champion).name)}</strong></div></div>`;
  if(qualified)h+=`<div class="winner"><div><div class="mut">Classificadas</div>${qualified.map((q,i)=>`<div class="champline" style="margin-top:6px">${i+1}. ${tname(q)}</div>`).join('')}</div></div>`;
  return h+body;
}
function render(){
  const r=route();document.body.dataset.g=r.g||'';nav();
  const y=[...document.querySelectorAll('main .scroll')].map(e=>e.scrollLeft),opened=[...document.querySelectorAll('main details')].map(d=>d.open);
  $('main').innerHTML=r.missing?'<p>Torneio não encontrado. Se ele foi salvo online, aguarde alguns segundos. <a href="#inicio">Voltar ao início</a></p>':r.t?tourPage(r.t):r.g?gamePage(r.g):home();
  document.querySelectorAll('main .scroll').forEach((e,i)=>e.scrollLeft=y[i]||0);
  document.querySelectorAll('main details').forEach((d,i)=>{if(opened[i]!==undefined)d.open=opened[i]});
}

/* ===== Placares ===== */
function matchDlg(id,mid){
  const m=build(all('tournaments')[id]).C.M[mid],w=Math.ceil(m.bo/2),sc=[];
  for(let l=0;l<w;l++)sc.push([w,l]);for(let l=w-1;l>=0;l--)sc.push([l,w]);
  dlg(`<h2 style="margin-top:0">Placar · MD${m.bo}</h2><div class="champline">${tname(m.A)}</div><div class="mut">contra</div><div class="champline">${tname(m.B)}</div><p class="small mut">O primeiro número é de ${esc(team(m.A).name)}.</p><div class="scores">${sc.map(s=>`<button data-act="score" data-id="${id}" data-m="${mid}" data-s="${s}">${s[0]}–${s[1]}</button>`).join('')}</div><div class="row" style="margin-top:14px">${m.score?`<button data-act="unscore" data-id="${id}" data-m="${mid}">Apagar placar</button>`:''}<span class="sp"></span><button data-act="close">Cancelar</button></div>`);
}
function simulate(id,allOfThem){
  save(id,T=>{
    for(let i=0;i<3000;i++){
      const m=Object.values(build(T).C.M).find(m=>!m.auto&&!m.score&&m.A!=null&&m.B!=null);if(!m)break;
      const ia=T.teams.indexOf(m.A),ib=T.teams.indexOf(m.B),pa=.5+(ib-ia)/T.teams.length*.3;
      const w=Math.ceil(m.bo/2),l=Math.floor(Math.random()*w);
      T.results[m.id]={a:m.A,b:m.B,s:Math.random()<pa?[w,l]:[l,w]};if(!allOfThem)break;
    }
  });
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dropDlg(id){
  const T=all('tournaments')[id],n=T.teams.length;
  dlg(`<h2 style="margin-top:0">Queda ${T.drops.length+1}</h2><form id="df" data-id="${id}"><div class="br-in small mut"><span>Equipe</span><span>Posição</span><span>Abates</span></div>${T.teams.map((t,i)=>`<div class="br-in"><span>${esc(team(t).name)}</span><input type="number" id="dp-${i}" min="1" max="${n}" required aria-label="Posição de ${esc(team(t).name)}"><input type="number" id="dk-${i}" min="0" max="99" value="0" required aria-label="Abates de ${esc(team(t).name)}"></div>`).join('')}<p id="df-err" style="color:var(--accent)"></p><div class="row"><button class="pri" type="submit">Salvar queda</button><button type="button" data-act="close">Cancelar</button></div></form>`);
}

/* ===== Eventos ===== */
let armed=null;
function confirmTwice(btn){if(armed===btn)return true;armed=btn;btn.textContent='Clique de novo para confirmar';return false}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const d=b.dataset,a=d.act,id=d.id;
  if(a==='team')openTeam(id,route().g||Object.keys(GAMES).find(g=>team(id).games.includes(g)));
  else if(a==='teamg')openTeam(id,d.g);
  else if(a==='close')closeDlg();
  else if(a==='tab'){ui.tab[d.g]=d.k;ui.q='';render()}
  else if(a==='newteam')teamForm(d.g);
  else if(a==='editteam')teamForm(route().g||all('teams')[id].games[0],id);
  else if(a==='delteam'){if(Object.values(all('tournaments')).some(T=>T.teams.includes(id)))toast('Remova a equipe dos torneios antes de excluir.');else if(confirmTwice(b)){put('teams',id,null);closeDlg()}}
  else if(a==='new'){const f=d.f||(d.g==='freefire'?'br':'double');createT(d.g,{name:'Meu torneio de '+GAMES[d.g].name,format:f})}
  else if(a==='open'){const e=CIRCUIT[d.g].find(x=>x.id===id);createT(d.g,{name:e.name+' · minha versão',format:e.format,cfg:e.cfg,champ:id})}
  else if(a==='add')save(id,T=>{if(!T.teams.includes(d.team))T.teams.push(d.team);T.started=false});
  else if(a==='load')save(id,T=>{T.teams=CIRCUIT[T.game].find(x=>x.id===T.champ).load.slice();T.results={};T.drops=[]});
  else if(a==='rm')save(id,T=>T.teams.splice(+d.i,1));
  else if(a==='up')save(id,T=>{const i=+d.i;[T.teams[i-1],T.teams[i]]=[T.teams[i],T.teams[i-1]]});
  else if(a==='shuffle')save(id,T=>T.teams=shuffled(T.teams));
  else if(a==='clear')save(id,T=>T.teams=[]);
  else if(a==='start')save(id,T=>{const sig=JSON.stringify([T.teams,T.format,T.groups,T.advance,T.wins,T.direct,T.playoff,T.bo,T.finalBo]);if(T.sig!==sig){T.results={};T.drops=[];T.sig=sig}T.started=true});
  else if(a==='edit'){const T=all('tournaments')[id];if((Object.keys(T.results).length||T.drops.length)&&!confirmTwice(b)){b.textContent='Mudanças apagam placares. Confirmar?';return}save(id,T=>T.started=false)}
  else if(a==='del'){if(confirmTwice(b)){const g=all('tournaments')[id].game;ui.tab[g]='mine';put('tournaments',id,null);location.hash=g}}
  else if(a==='match')matchDlg(id,d.m);
  else if(a==='score'){const m=build(all('tournaments')[id]).C.M[d.m];$('dialog').close();save(id,T=>T.results[d.m]={a:m.A,b:m.B,s:d.s.split(',').map(Number)})}
  else if(a==='unscore'){$('dialog').close();save(id,T=>delete T.results[d.m])}
  else if(a==='simone')simulate(id,false);
  else if(a==='simall')simulate(id,true);
  else if(a==='drop')dropDlg(id);
  else if(a==='simdrop')save(id,T=>{const o=shuffled(T.teams),e={};o.forEach((t,i)=>e[t]=[i+1,Math.floor(Math.random()*Math.max(2,10-i*.6))]);T.drops.push(e)});
  else if(a==='undodrop')save(id,T=>T.drops.pop());
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cfg){const r=route();save(r.t,T=>{const k=t.dataset.cfg;T[k]=k==='format'||k==='playoff'?t.value:k==='reset'?t.value==='1':+t.value})}
  else if(t.id==='tf-logo')readLogo(t.files[0]);
  else if(t.id==='tname')save(t.dataset.id,T=>T.name=t.value.trim()||'Torneio sem nome');
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;const q=t.value.toLowerCase();document.querySelectorAll('#tgrid>[data-name]').forEach(c=>c.hidden=!c.dataset.name.includes(q))}
  if(t.id==='adv-n'){const n=Math.round(+t.value);if(n>=2&&n<=32){ui.adv.n=n;$('#adv-t').innerHTML=advTable(n)}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='tf'){
    const name=$('#tf-name').value.trim(),tag=$('#tf-tag').value.trim().toUpperCase(),games=Object.keys(GAMES).filter(k=>$('#tf-g-'+k).checked);
    if(!name||!tag||!games.length)return toast('Preencha nome, sigla e ao menos um jogo.');
    const id=f.dataset.id||uid(),r=route();
    put('teams',id,{id,name,tag,region:$('#tf-reg').value.trim(),games,logo:pendingLogo,ach:$('#tf-ach').value.trim()});
    /* equipe criada dentro de um torneio em montagem já entra nele */
    if(r.t&&!f.dataset.id&&games.includes(r.g)){$('dialog').close();save(r.t,T=>T.teams.push(id))}else closeDlg();
    toast('Equipe salva.');
  }
  if(f.id==='df'){
    const T=all('tournaments')[f.dataset.id],entry={},seen=new Set();
    for(let i=0;i<T.teams.length;i++){const p=+$('#dp-'+i).value,k=+$('#dk-'+i).value;if(seen.has(p)){$('#df-err').textContent=`A posição ${p} foi usada duas vezes.`;return}seen.add(p);entry[T.teams[i]]=[p,k]}
    $('dialog').close();save(f.dataset.id,T=>T.drops.push(entry));
  }
});
window.addEventListener('hashchange',()=>{if($('dialog').open)$('dialog').close();armed=null;render();scrollTo(0,0)});
$('#sources').innerHTML=SOURCES.map(([n,u])=>`<a href="${u}">${n}</a>`).join(' · ');
status();render();connect();
</script>

</body></html>
